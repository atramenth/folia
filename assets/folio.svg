<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">Folia reading flow</title><desc id="d">A scanned book page moves through a quiet viewer with page navigation and a scrubber.</desc><rect width="960" height="360" rx="18" fill="#08090b"/><g fill="none" stroke="#7c8891" stroke-width="2"><path d="M275 180h115m180 0h115"/><path d="m377 172 12 8-12 8m180-16 12 8-12 8"/></g><g><rect x="104" y="55" width="171" height="250" rx="5" fill="#e3e6e5"/><rect x="119" y="70" width="141" height="220" fill="#ecefee" stroke="#c4c9c7"/><path d="M137 99h103M137 111h103M137 123h90M137 150h103M137 162h93M137 174h103M137 201h94M137 213h103M137 225h78" stroke="#7f8789" stroke-width="2" opacity=".6"/><text x="189" y="275" text-anchor="middle" fill="#586369" font-family="Georgia" font-size="11">printed page</text></g><g><rect x="390" y="42" width="180" height="276" rx="14" fill="#0e1114" stroke="#59656d"/><rect x="407" y="60" width="146" height="240" rx="3" fill="#d8d5cc"/><path d="M422 87h116M422 99h112M422 111h117M422 123h103M422 148h116M422 160h110M422 172h116M422 197h107M422 209h115M422 221h100M422 246h115M422 258h110" stroke="#424b50" stroke-width="2" opacity=".5"/><path d="M435 72h88" stroke="#7c8891" stroke-width="2"/><text x="480" y="286" text-anchor="middle" fill="#586369" font-family="Georgia" font-size="11">scan, read, turn</text></g><g><rect x="685" y="72" width="171" height="216" rx="5" fill="#0e1114" stroke="#59656d"/><text x="770" y="109" text-anchor="middle" fill="#d8d5cc" font-family="Georgia" font-size="17" font-style="italic">Folia</text><path d="M709 139h123M709 151h123M709 163h123M709 175h123" stroke="#7c8891" stroke-width="3" stroke-linecap="round"/><circle cx="716" cy="222" r="5" fill="#c9cfd2"/><path d="M716 222h108" stroke="#59656d" stroke-width="3"/><text x="770" y="258" text-anchor="middle" fill="#9aa3a8" font-family="Arial" font-size="11">PAGE SCRUBBER</text></g><text x="480" y="340" text-anchor="middle" fil